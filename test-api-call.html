<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVOICE API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>🎤 SOVOICE API Test</h1>
    <p>Testen Sie die SOVOICE API direkt von dieser Seite aus.</p>

    <div class="input-group">
        <label for="apiKey">API Key:</label>
        <input type="text" id="apiKey" placeholder="sk_live_..." value="">
    </div>

    <div class="input-group">
        <label for="phoneNumber">Telefonnummer:</label>
        <input type="tel" id="phoneNumber" placeholder="+491234567890" value="+491234567890">
    </div>

    <button onclick="makeCall()">📞 Anruf starten</button>

    <div id="result"></div>

    <script>
        async function makeCall() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const resultDiv = document.getElementById('result');

            // Validierung
            if (!apiKey) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Fehler: Bitte API Key eingeben';
                return;
            }

            if (!phoneNumber) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Fehler: Bitte Telefonnummer eingeben';
                return;
            }

            // Loading state
            resultDiv.className = 'result info';
            resultDiv.textContent = '⏳ Verbindung wird hergestellt...';

            try {
                const response = await fetch('https://sovoice.ai/api/sovoice/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        phoneNumber: phoneNumber,
                        direction: 'outbound'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Anruf erfolgreich gestartet!\n\nAntwort:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Fehler (${response.status}):\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Netzwerkfehler:\n${error.message}\n\nÜberprüfen Sie:\n- Ist die API erreichbar?\n- Blockiert CORS die Anfrage?\n- Ist der API Key korrekt?`;
            }
        }

        // API Key aus localStorage laden (falls vorhanden)
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('sovoice_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }

            // API Key speichern beim Eingeben
            document.getElementById('apiKey').addEventListener('change', (e) => {
                localStorage.setItem('sovoice_api_key', e.target.value);
            });
        });
    </script>
</body>
</html>
